<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>inputmode属性の紹介 (サンプル)</title>
  <link rel="stylesheet" href="style.css"/>
</head>
<body>
  <main>
    <h1>inputmode属性の紹介 (サンプル)</h1>

    <!-- inputmode ごとの仮想キーボードの違いを確認するための一覧。 -->
    <form>
      <label class="field">
        <span class="field-name">実数</span>
        <input type="text" inputmode="decimal"/>
      </label>
      <label class="field">
        <span class="field-name">数字</span>
        <input type="text" inputmode="numeric"/>
      </label>
      <label class="field">
        <span class="field-name">電話</span>
        <input type="text" inputmode="tel"/>
      </label>
      <label class="field">
        <span class="field-name">メール</span>
        <input type="text" inputmode="email"/>
      </label>
      <label class="field">
        <span class="field-name">検索入力</span>
        <input type="text" inputmode="search"/>
      </label>
      <label class="field">
        <span class="field-name">URL</span>
        <input type="text" inputmode="url"/>
      </label>
      <label class="field">
        <span class="field-name">テキスト</span>
        <input type="text" inputmode="text"/>
      </label>
      <label class="field">
        <span class="field-name">仮想キーボードなし</span>
        <input type="text" inputmode="none"/>
      </label>
    </form>
  </main>
</body>
</html>
